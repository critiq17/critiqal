name: Deploy to Production

on:
  push:
    branches: 
      - master

  workflow_dispatch:

concurrency:
  group: critiqal-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/critiqal-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/critiqal-frontend
  ADMIN_IMAGE: ghcr.io/${{ github.repository_owner }}/critiqal-admin

jobs:

  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      admin: ${{ steps.filter.outputs.admin }}
      compose: ${{ steps.filter.outputs.compose }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            admin:
              - 'admin-frontend/**'
            compose:
              - 'backend/docker-compose.prod.yml'

  build-backend:
    needs: detect-changes

    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.backend == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true

          tags: |
            ${{ env.BACKEND_IMAGE }}:prod
            ${{ env.BACKEND_IMAGE }}:prod-${{ github.sha }}

          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod

  build-frontend:
    needs: detect-changes

    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.frontend == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true

          build-args: |
            VITE_API_URL=

          tags: |
            ${{ env.FRONTEND_IMAGE }}:prod
            ${{ env.FRONTEND_IMAGE }}:prod-${{ github.sha }}

          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,mode=max,scope=frontend-prod

  build-admin:
    needs: detect-changes

    if: >
      github.event_name == 'workflow_dispatch' || 
      needs.detect-changes.outputs.admin == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build admin (frontend)
        uses: docker/build-push-action@v5
        with:
          context: ./admin-frontend
          push: true

          tags: |
            ${{ env.ADMIN_IMAGE }}:prod
            ${{ env.ADMIN_IMAGE }}:prod-${{ github.sha }}

          cache-from: type=gha,scope=admin-prod
          cache-to: type=gha,mode=max,scope=admin-prod

  deploy:
    needs:
      - detect-changes
      - build-backend
      - build-frontend
      - build-admin

    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.build-backend.result == 'success' ||
        needs.build-frontend.result == 'success' ||
        needs.build-admin.result == 'success' ||
        needs.detect-changes.outputs.compose == 'true'
      )

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Upload compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}

          source: backend/docker-compose.prod.yml
          target: /srv/apps/critiqal/prod/
          strip_components: 1
          overwrite: true

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}

          command_timeout: 10m

          script: |
            set -euo pipefail

            cd /srv/apps/critiqal/prod

            mv -f  docker-compose.prod.yml compose.yml

            echo "Validating compose..."
            docker compose config --quiet

            echo "Pulling images..."
            docker compose pull

            echo "Starting containers..."
            docker compose up -d --remove-orphans

            echo "Waiting for backend..."

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:11002/health >/dev/null; then
                echo "Backend OK"
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "Backend failed"
                docker compose logs --tail=100 backend
                exit 1
              fi

              sleep 2
            done

            echo "Checking frontend..."
            curl -fsS http://127.0.0.1:11001 >/dev/null

            echo "Checking admin..."
            curl -fsS http://127.0.0.1:11003 >/dev/null

            echo "Containers:"
            docker compose ps

            echo "Removing dangling images..."
            docker image prune -f >/dev/null 2>&1 || true

            echo "Production deploy successful"